<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Student Advice</title>
  <meta name="description" content="Tips from older students, for every year group.">
  <meta name="theme-color" content="#00807e">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="assets/crest.png">
</head>
<body>
  <div id="demo-banner" class="demo-banner" hidden>Demo · passwords <b>year8</b>…<b>year13</b> · admin <b>admin</b></div>

  <header class="top">
    <div class="wrap top-inner">
      <a href="#/" class="brand" aria-label="Home">
        <img src="assets/crest.png" alt="" width="105" height="127">
        <span data-site-name></span>
      </a>
      <a href="#/admin" id="queue-btn" class="queue-btn" hidden aria-label="Posts to check">📥 <b id="queue-count">0</b></a>
      <button class="add-btn" id="add-btn" type="button" aria-label="Add a tip">＋</button>
    </div>
  </header>

  <main id="app" class="wrap" aria-live="polite"></main>

  <footer class="foot">
    <div class="wrap">
      <span data-school-full></span>
      <button type="button" class="link-btn" id="admin-btn">Admin</button>
    </div>
  </footer>

  <!-- Add / edit a tip -->
  <dialog id="post-dialog" class="sheet">
    <form id="post-form" method="dialog" novalidate>
      <div class="sheet-head">
        <h2 id="post-dialog-title">Add a tip</h2>
        <button type="button" class="x-btn" data-close aria-label="Close">✕</button>
      </div>

      <div class="field" id="author-field">
        <span class="label">Your year</span>
        <div class="year-buttons" id="author-buttons"></div>
      </div>

      <div class="field">
        <span class="label">For</span>
        <div class="year-buttons" id="audience-buttons"></div>
      </div>

      <label class="field">
        <span class="label">Subject</span>
        <select name="subject" required></select>
      </label>

      <label class="field">
        <span class="label">Your tip</span>
        <textarea name="body" rows="6" maxlength="4000" placeholder="What do you wish you'd known?"></textarea>
      </label>

      <label class="field">
        <span class="label">Link <em>optional</em></span>
        <input name="link" type="url" maxlength="500" placeholder="https://">
      </label>

      <label class="field check" id="pinned-field" hidden>
        <input type="checkbox" name="pinned"> <span>📌 Pin to top</span>
      </label>

      <label class="field" id="password-field">
        <span class="label" id="password-label">Password</span>
        <input name="password" type="password" autocomplete="current-password">
      </label>

      <p class="form-error" id="post-error" role="alert" hidden></p>

      <button type="submit" class="big-btn" id="post-submit">Post</button>
    </form>
  </dialog>

  <!-- Admin login -->
  <dialog id="admin-dialog" class="sheet sheet-small">
    <form id="admin-form" method="dialog" novalidate>
      <div class="sheet-head">
        <h2>Admin</h2>
        <button type="button" class="x-btn" data-close aria-label="Close">✕</button>
      </div>
      <label class="field">
        <span class="label">Password</span>
        <input name="password" type="password" autocomplete="current-password" required>
      </label>
      <p class="form-error" id="admin-error" role="alert" hidden></p>
      <button type="submit" class="big-btn">Log in</button>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="js/config.js"></script>
  <script src="js/subjects.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
